name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    arch: x64,   ext: zip }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,   arch: arm64, ext: zip }
          - { os: macos-13,         target: x86_64-apple-darwin,       arch: x64,   ext: tar.gz }
          - { os: macos-latest,     target: aarch64-apple-darwin,      arch: arm64, ext: tar.gz }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl, arch: x64,   ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,arch: arm64, ext: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --workspace --target ${{ matrix.target }}
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $dir = "dist/tinkr-$ver-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tinkr.exe" $dir
          Copy-Item "target/${{ matrix.target }}/release/tinkr-proxy.exe" $dir
          Copy-Item LICENSE, NOTICE $dir
          if (-not $env:AZURE_SIGN_ENDPOINT) { Write-Warning "Unsigned build (no signing secrets configured)" }
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/tinkr-$ver-windows-${{ matrix.arch }}.zip" -Force
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          OS="${{ runner.os == 'macOS' && 'darwin' || 'linux' }}"
          NAME="tinkr-${VER}-${OS}-${{ matrix.arch }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/tinkr" "target/${{ matrix.target }}/release/tinkr-proxy" LICENSE NOTICE "dist/${NAME}/"
          echo "::warning::Unsigned build unless signing secrets are configured"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.{zip,tar.gz}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: artifacts/*
