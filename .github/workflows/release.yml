name: release
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    arch: x64,   ext: zip,    native: true }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,   arch: arm64, ext: zip,    native: true }
          - { os: macos-latest,     target: x86_64-apple-darwin,       arch: x64,   ext: tar.gz, native: false }
          - { os: macos-latest,     target: aarch64-apple-darwin,      arch: arm64, ext: tar.gz, native: true }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl, arch: x64,   ext: tar.gz, native: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,arch: arm64, ext: tar.gz, native: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with: { key: "release-${{ matrix.target }}" }
      - name: Test
        if: matrix.native
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $dir = "dist/tinkr-$ver-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tinkr.exe" $dir
          Copy-Item "target/${{ matrix.target }}/release/tinkr-proxy.exe" $dir
          Copy-Item LICENSE, NOTICE $dir
          if (-not $env:AZURE_SIGN_ENDPOINT) { Write-Warning "Unsigned build (no signing secrets configured)" }
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/tinkr-$ver-windows-${{ matrix.arch }}.zip" -Force
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          OS="${{ runner.os == 'macOS' && 'darwin' || 'linux' }}"
          NAME="tinkr-${VER}-${OS}-${{ matrix.arch }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/tinkr" "target/${{ matrix.target }}/release/tinkr-proxy" LICENSE NOTICE "dist/${NAME}/"
          echo "::warning::Unsigned build unless signing secrets are configured"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  update-packages:
    needs: publish
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Update Homebrew tap (thunderkex/homebrew-tap)
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER="${VER#v}"
          curl -fsSL "https://github.com/thunderkex/Tinkr/releases/download/v${VER}/SHA256SUMS" -o SHA256SUMS
          SHA_DARWIN_ARM64=$(awk '/darwin-arm64\.tar\.gz$/ {print $1}' SHA256SUMS)
          SHA_DARWIN_X64=$(awk '/darwin-x64\.tar\.gz$/ {print $1}' SHA256SUMS)
          SHA_LINUX_ARM64=$(awk '/linux-arm64\.tar\.gz$/ {print $1}' SHA256SUMS)
          SHA_LINUX_X64=$(awk '/linux-x64\.tar\.gz$/ {print $1}' SHA256SUMS)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/thunderkex/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/tinkr.rb <<EOF
          class Tinkr < Formula
            desc "Optimize your agent's context automatically"
            homepage "https://github.com/thunderkex/Tinkr"
            version "${VER}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/thunderkex/Tinkr/releases/download/v${VER}/tinkr-${VER}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/thunderkex/Tinkr/releases/download/v${VER}/tinkr-${VER}-darwin-x64.tar.gz"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/thunderkex/Tinkr/releases/download/v${VER}/tinkr-${VER}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/thunderkex/Tinkr/releases/download/v${VER}/tinkr-${VER}-linux-x64.tar.gz"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install "tinkr"
              bin.install "tinkr-proxy"
            end

            test do
              assert_match "tinkr", shell_output("#{bin}/tinkr --version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tinkr.rb
          git commit -m "tinkr ${VER}"
          git push origin HEAD:main

      - name: Submit Winget update PR (microsoft/winget-pkgs)
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: thunderkex.Tinkr
          token: ${{ secrets.WINGET_TOKEN }}
